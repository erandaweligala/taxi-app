# Full local stack: infrastructure (Redis, Kafka, Postgres) plus the four
# application services. `docker compose up` brings up an end-to-end, runnable
# ride-hailing platform.

services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    # KRaft mode (no ZooKeeper) for a single-node dev broker.
    image: bitnami/kafka:3.7
    ports: ["9092:9092"]
    environment:
      KAFKA_CFG_NODE_ID: "0"
      KAFKA_CFG_PROCESS_ROLES: "controller,broker"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "0@kafka:9093"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15

  postgres:
    image: postgres:16-alpine
    ports: ["5432:5432"]
    environment:
      POSTGRES_USER: taxi
      POSTGRES_PASSWORD: taxi
      POSTGRES_DB: taxi
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taxi"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    command: ["api"]
    ports: ["8080:8080"]
    environment: &appenv
      REDIS_ADDR: redis:6379
      KAFKA_BROKERS: kafka:9092
      POSTGRES_DSN: postgres://taxi:taxi@postgres:5432/taxi?sslmode=disable
      HTTP_ADDR: ":8080"
      GATEWAY_ADDR: ":8090"
    depends_on:
      redis: {condition: service_healthy}
      kafka: {condition: service_healthy}
      postgres: {condition: service_healthy}

  locationworker:
    build: .
    command: ["locationworker"]
    environment: *appenv
    depends_on:
      redis: {condition: service_healthy}
      kafka: {condition: service_healthy}

  tripworker:
    build: .
    command: ["tripworker"]
    environment: *appenv
    depends_on:
      redis: {condition: service_healthy}
      kafka: {condition: service_healthy}
      postgres: {condition: service_healthy}

  gateway:
    build: .
    command: ["gateway"]
    ports: ["8090:8090"]
    environment: *appenv
    depends_on:
      redis: {condition: service_healthy}
